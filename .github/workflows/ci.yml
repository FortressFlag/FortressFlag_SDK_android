# Continuous integration for the Android client SDK.
#
# This workflow IS the merge gate described in Founding CLAUDE.md §7.5 and §9. It matters more
# here than almost anywhere else: we cannot recall a shipped SDK, so anything that gets past
# this gate lives in customers' apps until they rebuild and ship on their own schedule.
#
# NOTE for whoever adds the branch ruleset: add these four job names as required checks *after*
# this file lands on `development` (docs/compliance/change-management.md in
# FortressFlag_Backend). Requiring a check that has never reported blocks every merge
# permanently.

name: CI

on:
  pull_request:
  push:
    branches: [development]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build, lint & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Build, lint & unit tests
        run: ./gradlew build lint test

      - name: ktlint
        # ktlintCheck already runs inside `build` via the plugin's check wiring; this explicit
        # invocation keeps the lint gate visible as its own step in the log rather than
        # buried in a build failure.
        run: ./gradlew ktlintCheck

  crash-primitives:
    name: No crash primitives in library sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Grep for crash primitives
        # Deliberately a dumb grep, and deliberately separate from ktlint. The lint config is
        # one pull request away from being relaxed with a plausible-looking justification;
        # this is harder to weaken quietly, and a reviewer seeing it removed knows exactly
        # what it meant.
        #
        # `!!` is Kotlin's `try!`: a null that fires inside our code crashes the customer's
        # app, and no amount of error handling above it helps (Founding §8.1). TODO( catches
        # kotlin.TODO(), which throws NotImplementedError at runtime.
        run: |
          if grep -rnE '!!|TODO\(' fortressflag/src/main/; then
            echo "::error::Crash primitives found in fortressflag/src/main/. The SDK must never trap inside a customer's app."
            exit 1
          fi
          echo "No crash primitives in library sources."

  device-tests:
    name: Keystore & identity tests (emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM
        # The hosted runner ships KVM but gates /dev/kvm behind root; without this the
        # emulator silently falls back to a speed that times the job out.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented tests on emulator
        # The analogue of the iOS simulator job: identity-storage tests run against the REAL
        # Keystore, not a stub — a keychain stub would test our idea of the keychain, and the
        # behaviour that matters (key generation, encryption before first unlock semantics)
        # is exactly the part a stub would get to define for itself.
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          disable-animations: true
          script: ./gradlew :fortressflag:connectedAndroidTest

  security:
    name: Security scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks needs history to scan commits, not just the working tree.
          fetch-depth: 0

      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          # SHA-256 of gitleaks_8.30.1_linux_x64.tar.gz, from the release's published
          # checksums.txt. Pinning the version alone still trusts whatever bytes that URL
          # serves on the day CI runs; this is what makes the download reproducible. Bump both
          # lines together — a version bumped without its checksum fails loudly here, which is
          # intended.
          #
          # Deliberately NOT gitleaks/gitleaks-action@v2. That action requires a paid licence
          # for organisation-owned repositories, so it simply fails here — and a floating @v2
          # tag in the job whose entire subject is supply-chain hygiene is the wrong shape
          # anyway. This matches the backend and iOS security jobs exactly.
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          # pipefail matters: without it a curl that dies mid-stream is masked by a tar that
          # happens to succeed on the truncated prefix.
          set -euo pipefail
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          # Unpacked outside the checkout so the scanner never sees its own artefacts.
          "$RUNNER_TEMP/gitleaks" git . --redact --no-banner

      - name: No checked-in signing keys
        # A private key appearing in this repo would mean someone made signing convenient,
        # which is how signing stops being worth anything.
        run: |
          if grep -rlE 'BEGIN (RSA |EC |OPENSSH |PGP )?PRIVATE KEY' . --exclude-dir=.git; then
            echo "::error::A private key is checked into this repository."
            exit 1
          fi
          echo "No private keys checked in."
