# The version catalog is the single place dependencies are declared. The SDK's runtime
# dependency policy is kotlinx-coroutines ONLY (ADR-0013): HTTP is HttpURLConnection, JSON is
# the platform's org.json, storage is the platform Keystore — every library here beyond
# coroutines is build- or test-scoped and never reaches a customer's app.

[versions]
agp = "8.7.3"
kotlin = "2.1.0"
coroutines = "1.10.1"
ktlint-plugin = "12.1.2"
junit = "4.13.2"
orgjson = "20250107"
androidx-test-ext = "1.2.1"
androidx-test-runner = "1.6.2"

[libraries]
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
junit = { module = "junit:junit", version.ref = "junit" }
# The REAL org.json for JVM unit tests: the Android Gradle plugin stubs android.jar's org.json
# on the JVM ("not mocked"), and routing every JSON test through an interface to dodge that
# would test our idea of JSON instead of JSON.
orgjson = { module = "org.json:json", version.ref = "orgjson" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-plugin" }
